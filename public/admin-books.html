<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookHub - Quản lý sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <main class="admin-overview-page">
      <h2 class="admin-page-title">3. Quản lý sách</h2>
      <section class="admin-layout-card shadow-sm">
        <div class="row g-0">
          <aside class="col-lg-3 col-xl-2 admin-sidebar">
            <div class="admin-brand-wrap">
              <h4 class="admin-brand mb-1">📚 BookHub</h4>
              <small>Quản trị hệ thống</small>
            </div>
            <nav class="admin-menu nav flex-column">
              <a class="nav-link" href="/admin.html"><i class="bi bi-grid"></i>Tổng quan</a>
              <a class="nav-link active" href="/admin-books.html"><i class="bi bi-book"></i>Quản lý sách</a>
              <a class="nav-link" href="/admin-users.html"><i class="bi bi-people"></i>Quản lý độc giả</a>
              <a class="nav-link" href="/admin-borrows.html"><i class="bi bi-journal-check"></i>Quản lý mượn trả</a>
            </nav>
          </aside>

          <section class="col-lg-9 col-xl-10 admin-content">
            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
              <h3 class="admin-section-title mb-0">Quản lý sách</h3>
              <div class="d-flex gap-2">
                <button class="btn btn-brown" data-bs-toggle="modal" data-bs-target="#book-modal">
                  <i class="bi bi-plus-lg me-1"></i>Thêm sách
                </button>
                <button id="admin-logout" class="btn btn-outline-danger btn-sm">Đăng xuất</button>
              </div>
            </div>

            <section class="card border-0 shadow-sm mb-3">
              <div class="card-body">
                <div class="row g-2 align-items-center mb-3">
                  <div class="col-lg-7">
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-search"></i></span>
                      <input
                        id="book-search"
                        class="form-control"
                        placeholder="Tìm theo mã, tên sách, tác giả, thể loại, mô tả..."
                      />
                      <button class="btn btn-outline-secondary" id="book-voice-btn" type="button" title="Tìm bằng giọng nói">
                        <i class="bi bi-mic-fill"></i>
                      </button>
                    </div>
                    <small id="voice-status" class="text-muted"></small>
                  </div>
                  <div class="col-lg-5 text-lg-end">
                    <span class="text-muted small">Mỗi trang hiển thị 5 sách</span>
                  </div>
                </div>

                <div class="table-responsive">
                  <table class="table table-hover align-middle admin-books-table">
                    <thead>
                      <tr>
                        <th>Ảnh</th>
                        <th>Mã</th>
                        <th>Tên sách</th>
                        <th>Tác giả</th>
                        <th>Thể loại</th>
                        <th>Số lượng</th>
                        <th>Thao tác</th>
                      </tr>
                    </thead>
                    <tbody id="books-table"></tbody>
                  </table>
                </div>
                <nav>
                  <ul id="books-pagination" class="pagination pagination-sm justify-content-end mb-0"></ul>
                </nav>
              </div>
            </section>
          </section>
        </div>
      </section>
    </main>

    <div class="modal fade" id="book-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <form id="book-form" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="book-modal-title">Thêm sách</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Mã sách</label>
                <input id="book-id" class="form-control" required />
              </div>
              <div class="col-md-8">
                <label class="form-label">Tên sách</label>
                <input id="book-name" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Tác giả / Nguồn gốc</label>
                <input id="book-author" class="form-control" required />
              </div>
              <div class="col-md-3">
                <label class="form-label">Thể loại</label>
                <input id="book-category" class="form-control" />
              </div>
              <div class="col-md-3">
                <label class="form-label">Số lượng</label>
                <input id="book-qty" type="number" min="0" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Giá</label>
                <input id="book-price" type="number" min="0" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Năm xuất bản</label>
                <input id="book-year" type="number" min="1900" class="form-control" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Mã NXB</label>
                <input id="book-publisher" class="form-control" value="NXB01" />
              </div>
              <div class="col-12">
                <label class="form-label">Ảnh bìa (URL/path)</label>
                <input id="book-cover" class="form-control" value="/images/books/placeholder-book.svg" />
              </div>
              <div class="col-12">
                <label class="form-label">Mô tả</label>
                <textarea id="book-description" class="form-control" rows="2"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="submit" class="btn btn-brown" id="book-submit-btn">Lưu sách</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-books.js"></script>
  </body>
</html>
