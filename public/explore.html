<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khám phá sách - BookHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold text-brown" href="/">📚 BookHub</a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 small">
          <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold text-brown" href="/explore.html">Khám phá</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Cộng đồng</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Bảng xếp hạng</a></li>
          <li class="nav-item"><a class="nav-link" href="/my-library.html">Cá nhân</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white">🔍</span>
            <input id="top-search" class="form-control" placeholder="Tìm sách, tác giả, thể loại..." />
          </div>
          <button id="top-voice" class="btn btn-sm btn-outline-info">🎤</button>
          <a class="btn btn-sm btn-outline-primary" href="/login.html">Đăng nhập</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <button class="btn btn-outline-secondary btn-sm mb-2 d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#mobile-filters">Bộ lọc</button>
      <div class="row g-3">
        <aside class="col-lg-3 collapse d-lg-block" id="mobile-filters">
          <div class="card border-0 shadow-sm sticky-top explore-sidebar">
            <div class="card-body">
              <h5 class="section-title mb-3">Bộ lọc</h5>

              <div class="mb-3">
                <h6 class="small fw-bold">Thể loại</h6>
                <div id="genre-filters" class="filter-list"></div>
              </div>

              <div class="mb-3">
                <h6 class="small fw-bold">Tác giả</h6>
                <input id="author-search" class="form-control form-control-sm mb-2" placeholder="Lọc tác giả" />
                <div id="author-filters" class="filter-list"></div>
              </div>

              <div class="mb-3">
                <h6 class="small fw-bold">Đánh giá</h6>
                <div id="rating-filters" class="filter-list"></div>
              </div>

              <div>
                <h6 class="small fw-bold">Năm xuất bản</h6>
                <div id="year-filters" class="filter-list"></div>
              </div>
            </div>
          </div>
        </aside>

        <section class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="section-title mb-0" id="result-title">Tất cả sách</h4>
            <select id="sort-select" class="form-select w-auto">
              <option value="newest">Sắp xếp: Mới nhất</option>
              <option value="rating">Đánh giá cao</option>
              <option value="titleAZ">Tên A-Z</option>
              <option value="quantityDesc">Số lượng nhiều nhất</option>
              <option value="priceAsc">Giá tăng</option>
              <option value="priceDesc">Giá giảm</option>
            </select>
          </div>

          <div id="book-items" class="d-grid gap-2"></div>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <small class="text-muted" id="paging-info"></small>
            <div class="btn-group btn-group-sm">
              <button id="prev-page" class="btn btn-outline-secondary">Trang trước</button>
              <button id="next-page" class="btn btn-outline-secondary">Trang sau</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <button id="chat-fab" class="chat-fab" title="Mở chatbot">🤖</button>
    <div id="chat-fab-panel" class="chat-fab-panel d-none">
      <div class="p-2 border-bottom fw-semibold">Chatbot hỗ trợ</div>
      <div class="chat-box m-2" id="chat-box"></div>
      <div class="input-group p-2 pt-0">
        <input id="chat-input" class="form-control form-control-sm" placeholder="Nhập câu hỏi..." />
        <button id="chat-send" class="btn btn-dark btn-sm">Gửi</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/explore.js"></script>
  </body>
</html>
