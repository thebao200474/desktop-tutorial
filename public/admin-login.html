<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookHub | Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/admin-login.css" />
  </head>
  <body>
    <main class="admin-login-page">
      <h2 class="admin-login-page-title">1. Trang đăng nhập admin</h2>

      <section class="admin-login-shell">
        <div class="admin-brand">📖 <span>BookHub</span></div>

        <div class="admin-form-card">
          <h1 class="admin-form-title">Đăng nhập quản trị</h1>
          <p class="admin-form-subtitle">Vui lòng đăng nhập để tiếp tục</p>

          <div class="admin-manual-note">
            <div>Tài khoản admin mặc định: <span class="manual-fill">__TU_DIEN_EMAIL_ADMIN__</span></div>
            <div>Mật khẩu mặc định: <span class="manual-fill">__TU_DIEN_MAT_KHAU_ADMIN__</span></div>
          </div>

          <div id="admin-login-alert" class="alert alert-danger py-2 d-none" role="alert"></div>

          <form id="admin-login-form" novalidate>
            <div class="mb-3">
              <label for="admin-email" class="form-label">Email</label>
              <input type="email" class="form-control" id="admin-email" placeholder="__TU_DIEN_EMAIL_ADMIN__" required />
              <div class="invalid-feedback">Vui lòng nhập email admin hợp lệ.</div>
            </div>

            <div class="mb-2">
              <label for="admin-password" class="form-label">Mật khẩu</label>
              <div class="password-wrap">
                <input type="password" class="form-control" id="admin-password" placeholder="__TU_DIEN_MAT_KHAU_ADMIN__" required />
                <button type="button" id="toggle-password" class="password-toggle" aria-label="Hiện/ẩn mật khẩu">👁</button>
              </div>
              <div class="invalid-feedback d-block" id="password-error"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center admin-options-row mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="1" id="remember-login" />
                <label class="form-check-label" for="remember-login">Ghi nhớ đăng nhập</label>
              </div>
              <a href="#" class="forgot-link">Quên mật khẩu</a>
            </div>

            <button type="submit" id="admin-login-submit" class="btn admin-login-btn w-100">Đăng nhập</button>
          </form>
        </div>

        <p class="admin-login-footer">© 2024 BookHub. All rights reserved.</p>
      </section>
    </main>

    <script src="/js/admin-login.js"></script>
  </body>
</html>
