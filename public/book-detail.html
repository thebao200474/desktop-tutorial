<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sách - BookHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a href="/" class="navbar-brand fw-bold text-brown">← Quay lại trang chủ</a>
      </div>
    </nav>

    <main class="container py-4">
      <div class="card border-0 shadow-sm p-3 p-lg-4">
        <div class="row g-4" id="book-detail-wrap"></div>
      </div>

      <section class="card border-0 shadow-sm mt-3">
        <div class="card-body">
          <h5 class="section-title">Đánh giá sách</h5>
          <form id="review-form" class="row g-2 mb-3">
            <div class="col-md-3">
              <select id="rating" class="form-select">
                <option value="5">5 sao</option>
                <option value="4">4 sao</option>
                <option value="3">3 sao</option>
                <option value="2">2 sao</option>
                <option value="1">1 sao</option>
              </select>
            </div>
            <div class="col-md-7">
              <input id="comment" class="form-control" placeholder="Nhập nhận xét của bạn" />
            </div>
            <div class="col-md-2 d-grid">
              <button class="btn btn-primary" type="submit">Gửi</button>
            </div>
          </form>
          <ul id="review-list" class="list-group list-group-flush"></ul>
        </div>
      </section>
    </main>

    <script src="/book-detail.js"></script>
  </body>
</html>
