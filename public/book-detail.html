<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sách - BookHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold text-brown" href="/">📚 BookHub</a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 small">
          <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold text-brown" href="/explore.html">Khám phá</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Cộng đồng</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Bảng xếp hạng</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Cá nhân</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white">🔍</span>
            <input class="form-control" placeholder="Tìm sách, tác giả, thể loại..." />
          </div>
          <a class="btn btn-sm btn-outline-primary" href="/login.html">Đăng nhập</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small mb-0">
          <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
          <li class="breadcrumb-item"><a href="/explore.html">Khám phá</a></li>
          <li class="breadcrumb-item active" id="breadcrumb-title" aria-current="page">Chi tiết sách</li>
        </ol>
      </nav>

      <section class="card border-0 shadow-sm p-3 p-lg-4 mb-3">
        <div class="row g-4 align-items-start" id="book-detail-wrap"></div>
      </section>

      <section class="card border-0 shadow-sm mb-3">
        <div class="card-body">
          <h5 class="section-title">Giới thiệu sách</h5>
          <p id="book-intro" class="mb-0 text-secondary"></p>
        </div>
      </section>

      <section class="card border-0 shadow-sm mb-3">
        <div class="card-body">
          <h5 class="section-title mb-3">Đánh giá từ cộng đồng</h5>
          <div class="row g-3 align-items-start">
            <div class="col-md-3">
              <div class="display-5 fw-bold text-brown" id="avg-rating">4.6</div>
              <div class="text-muted" id="total-rating-text">2,345 đánh giá</div>
            </div>
            <div class="col-md-9" id="rating-breakdown"></div>
          </div>
        </div>
      </section>

      <section class="card border-0 shadow-sm mb-3">
        <div class="card-body d-flex align-items-start gap-3" id="featured-review"></div>
      </section>

      <section class="card border-0 shadow-sm">
        <div class="card-body">
          <h6 class="section-title">Gửi đánh giá của bạn</h6>
          <form id="review-form" class="row g-2 mb-1">
            <div class="col-md-2">
              <select id="rating" class="form-select">
                <option value="5">5 sao</option>
                <option value="4">4 sao</option>
                <option value="3">3 sao</option>
                <option value="2">2 sao</option>
                <option value="1">1 sao</option>
              </select>
            </div>
            <div class="col-md-8">
              <input id="comment" class="form-control" placeholder="Nhập nhận xét của bạn" />
            </div>
            <div class="col-md-2 d-grid">
              <button class="btn btn-primary" type="submit">Gửi</button>
            </div>
          </form>
          <ul id="review-list" class="list-group list-group-flush"></ul>
        </div>
      </section>
    </main>

    <script src="/book-detail.js"></script>
  </body>
</html>
