<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookHub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container py-4">
      <h2 class="mb-3">Quản trị viên thư viện (OTP qua Gmail)</h2>
      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5>Đăng nhập Admin</h5>
              <input id="admin-email" class="form-control mb-2" value="admin@example.com" />
              <div class="d-flex gap-2 mb-2">
                <button class="btn btn-outline-primary" id="admin-send-otp">Gửi OTP</button>
                <input id="admin-otp" class="form-control" placeholder="Nhập OTP" />
              </div>
              <button class="btn btn-primary w-100" id="admin-verify">Xác thực OTP</button>
              <small id="admin-status" class="text-muted d-block mt-2"></small>
            </div>
          </div>

          <div class="card shadow-sm mt-3">
            <div class="card-body">
              <h6>Thêm sách nhanh</h6>
              <input id="new-book-id" class="form-control mb-2" placeholder="Mã sách" />
              <input id="new-book-name" class="form-control mb-2" placeholder="Tên sách" />
              <input id="new-book-author" class="form-control mb-2" placeholder="Tác giả / Nguồn gốc" />
              <input id="new-book-qty" type="number" class="form-control mb-2" placeholder="Số lượng" />
              <button id="add-book-btn" class="btn btn-dark w-100">Thêm sách</button>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="row g-3 mb-1">
            <div class="col-6 col-md-3"><div class="card shadow-sm"><div class="card-body"><div>Tổng sách</div><h4 id="s-total-books">0</h4></div></div></div>
            <div class="col-6 col-md-3"><div class="card shadow-sm"><div class="card-body"><div>Độc giả</div><h4 id="s-readers">0</h4></div></div></div>
            <div class="col-6 col-md-3"><div class="card shadow-sm"><div class="card-body"><div>Đang mượn</div><h4 id="s-borrowed">0</h4></div></div></div>
            <div class="col-6 col-md-3"><div class="card shadow-sm"><div class="card-body"><div>Quá hạn</div><h4 id="s-overdue">0</h4></div></div></div>
          </div>

          <div class="card shadow-sm mb-3">
            <div class="card-body">
              <h5>Quản lý sách</h5>
              <div class="table-responsive">
                <table class="table table-striped">
                  <thead><tr><th>Mã</th><th>Tên sách</th><th>Tác giả</th><th>Số lượng</th><th></th></tr></thead>
                  <tbody id="books-table"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="card shadow-sm mb-3">
            <div class="card-body">
              <h5>Quản lý độc giả</h5>
              <div class="table-responsive">
                <table class="table table-striped">
                  <thead><tr><th>Mã</th><th>Họ tên</th><th>Email</th><th>Điện thoại</th></tr></thead>
                  <tbody id="users-table"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <h5>Theo dõi mượn sách</h5>
              <div class="table-responsive">
                <table class="table table-striped">
                  <thead><tr><th>Mã mượn</th><th>Độc giả</th><th>Sách</th><th>Ngày mượn</th><th>Hạn trả</th><th>Trạng thái</th></tr></thead>
                  <tbody id="loans-table"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/admin.js"></script>
  </body>
</html>
