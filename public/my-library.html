<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giá sách cá nhân - BookHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold text-brown" href="/">📚 BookHub</a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 small">
          <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="/explore.html">Khám phá</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Cộng đồng</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Bảng xếp hạng</a></li>
          <li class="nav-item"><a class="nav-link active fw-semibold text-brown" href="/my-library.html">Cá nhân</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <input class="form-control form-control-sm" placeholder="Tìm sách, tác giả, thể loại..." />
          <img src="/images/users/user-1.svg" class="review-avatar" alt="user" />
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row g-3">
        <aside class="col-lg-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-center mb-3">
                <img src="/images/users/user-1.svg" class="library-avatar mb-2" alt="avatar" />
                <div class="fw-semibold">Nguyễn Văn A</div>
                <div class="text-muted small">@nguyenvana</div>
              </div>

              <div class="d-grid gap-1 library-menu">
                <a href="#" class="library-menu-item">Tổng quan</a>
                <a href="/my-library.html" class="library-menu-item active">Giá sách</a>
                <a href="#" class="library-menu-item">Đánh giá</a>
                <a href="#" class="library-menu-item">Danh sách muốn đọc</a>
                <a href="#" class="library-menu-item">Bạn bè</a>
                <a href="#" class="library-menu-item">Thành tích</a>
                <a href="#" class="library-menu-item">Cài đặt</a>
              </div>
            </div>
          </div>
        </aside>

        <section class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="section-title mb-0" id="lib-title">Giá sách của tôi (0)</h4>
            <a class="btn btn-brown btn-sm" href="/explore.html">+ Thêm sách</a>
          </div>

          <div class="d-flex flex-wrap gap-2 mb-3" id="status-tabs"></div>

          <div class="row g-3" id="library-grid"></div>
        </section>
      </div>
    </main>

    <button id="chat-fab" class="chat-fab" title="Mở chatbot">🤖</button>
    <div id="chat-fab-panel" class="chat-fab-panel d-none">
      <div class="p-2 border-bottom fw-semibold">Chatbot hỗ trợ</div>
      <div class="chat-box m-2" id="chat-box"></div>
      <div class="input-group p-2 pt-0">
        <input id="chat-input" class="form-control form-control-sm" placeholder="Nhập câu hỏi..." />
        <button id="chat-send" class="btn btn-dark btn-sm">Gửi</button>
      </div>
    </div>

    <script src="/my-library.js"></script>
  </body>
</html>
