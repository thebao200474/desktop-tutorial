<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - BookHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a href="/" class="navbar-brand text-brown fw-bold">📚 BookHub</a>
        <div>
          <a class="btn btn-outline-secondary btn-sm" href="/register.html">Đăng ký</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <h3 class="section-title text-center mb-3">Đăng nhập</h3>
              <form id="login-form" class="d-grid gap-3">
                <div>
                  <label class="form-label">Email</label>
                  <input type="email" id="login-email" class="form-control" placeholder="Nhập email" required />
                </div>
                <div>
                  <label class="form-label">Mật khẩu</label>
                  <input type="password" id="login-password" class="form-control" placeholder="Nhập mật khẩu" required />
                </div>
                <button class="btn btn-primary" type="submit">Đăng nhập</button>
              </form>
              <small id="login-status" class="text-muted d-block mt-2"></small>
              <hr />
              <p class="mb-0 text-center">Bạn chưa có tài khoản? <a href="/register.html">Đăng ký ngay</a></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/auth.js"></script>
  </body>
</html>
