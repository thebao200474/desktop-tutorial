<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - BookHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a href="/" class="navbar-brand text-brown fw-bold">📚 BookHub</a>
        <a class="btn btn-outline-secondary btn-sm" href="/login.html">Đăng nhập</a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <h3 class="section-title text-center mb-3">Đăng ký tài khoản</h3>
              <div id="register-alert" class="small mb-2"></div>
              <form id="register-form" class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Họ lót</label>
                  <input type="text" id="reg-holot" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Tên</label>
                  <input type="text" id="reg-ten" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" id="reg-email" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Số điện thoại</label>
                  <input type="text" id="reg-phone" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Ngày sinh</label>
                  <input type="date" id="reg-dob" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phái</label>
                  <select id="reg-gender" class="form-select" required>
                    <option value="">-- Chọn --</option>
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                    <option value="Khác">Khác</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label">Địa chỉ</label>
                  <input type="text" id="reg-address" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Mật khẩu</label>
                  <input type="password" id="reg-password" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Xác nhận mật khẩu</label>
                  <input type="password" id="reg-confirm-password" class="form-control" required />
                </div>

                <div class="col-md-8">
                  <label class="form-label">OTP</label>
                  <input type="text" id="reg-otp" class="form-control" maxlength="6" placeholder="Nhập mã OTP 6 số" required />
                </div>
                <div class="col-md-4 d-grid align-items-end">
                  <button class="btn btn-outline-primary mt-4" type="button" id="send-register-otp">Gửi OTP</button>
                </div>

                <div class="col-12 d-grid">
                  <button class="btn btn-success" type="submit">Đăng ký</button>
                </div>
              </form>
              <p class="mb-0 mt-3 text-center">Đã có tài khoản? <a href="/login.html">Đăng nhập ngay</a></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <button id="chat-fab" class="chat-fab" title="Mở chatbot">🤖</button>
    <div id="chat-fab-panel" class="chat-fab-panel d-none">
      <div class="p-2 border-bottom fw-semibold">Chatbot hỗ trợ</div>
      <div class="chat-box m-2" id="chat-box"></div>
      <div class="input-group p-2 pt-0">
        <input id="chat-input" class="form-control form-control-sm" placeholder="Nhập câu hỏi..." />
        <button id="chat-send" class="btn btn-dark btn-sm">Gửi</button>
      </div>
    </div>

    <script src="/auth.js"></script>
  </body>
</html>
