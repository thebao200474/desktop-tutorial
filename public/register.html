<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký - BookHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a href="/" class="navbar-brand text-brown fw-bold">📚 BookHub</a>
        <div>
          <a class="btn btn-outline-secondary btn-sm" href="/login.html">Đăng nhập</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <h3 class="section-title text-center mb-3">Đăng ký tài khoản</h3>
              <form id="register-form" class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Họ lót</label>
                  <input type="text" id="reg-holot" class="form-control" placeholder="Nguyễn Văn" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Tên</label>
                  <input type="text" id="reg-ten" class="form-control" placeholder="An" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" id="reg-email" class="form-control" placeholder="name@email.com" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Số điện thoại</label>
                  <input type="text" id="reg-phone" class="form-control" placeholder="09xxxxxxxx" />
                </div>
                <div class="col-12">
                  <label class="form-label">Địa chỉ</label>
                  <input type="text" id="reg-address" class="form-control" placeholder="Địa chỉ" />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Mật khẩu</label>
                  <input type="password" id="reg-password" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Xác nhận mật khẩu</label>
                  <input type="password" id="reg-confirm-password" class="form-control" required />
                </div>
                <div class="col-12 d-grid">
                  <button class="btn btn-success" type="submit">Đăng ký</button>
                </div>
              </form>
              <small id="register-status" class="text-muted d-block mt-2"></small>
              <hr />
              <p class="mb-0 text-center">Đã có tài khoản? <a href="/login.html">Đăng nhập ngay</a></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/auth.js"></script>
  </body>
</html>
